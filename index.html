<!doctype html>
<html lang="en" data-theme="light" data-accent="blue" data-living-time="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Apply saved theme BEFORE paint (no dark flash) -->
    <script>
      (function () {
        try {
          var KEY = 'akash_portfolio_design_system_v3';
          var raw =
            localStorage.getItem(KEY) ||
            localStorage.getItem('akash_portfolio_design_system_v2');
          var theme = 'light';
          var accent = 'blue';
          var living = false;
          if (raw) {
            var s = JSON.parse(raw);
            if (s.theme === 'dark' || s.theme === 'light') theme = s.theme;
            if (s.accent) accent = s.accent;
            living = !!s.livingTimeEnabled;
          }
          // Living time can force light/dark from clock — still apply accent from save
          if (living) {
            var h = new Date().getHours();
            if (h >= 6 && h < 17) theme = 'light';
            else theme = 'dark';
          }
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.setAttribute('data-accent', accent);
          root.setAttribute('data-living-time', living ? 'true' : 'false');
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f8fafc' : '#0a0d12');
        } catch (e) {}
      })();
    </script>

    <title>Akash Vaidya | Junior Flutter Developer</title>
    <meta name="title" content="Akash Vaidya | Junior Flutter Developer" />
    <meta name="description" content="Junior Software Developer with 1.5 years of Flutter experience. Android & iOS apps with Dart, Firebase, GetX, Riverpod, and BLoC. Handmade portfolio." />
    <meta name="keywords" content="Akash Vaidya, Flutter Developer, Junior Software Developer, Dart, Firebase, Riverpod, GetX, BLoC" />
    <meta name="author" content="Akash Vaidya" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Akash Vaidya | Junior Flutter Developer" />
    <meta property="og:description" content="1.5 years Flutter · Android & iOS · Dart, Firebase, GetX / Riverpod / BLoC. Handmade portfolio." />

    <meta property="twitter:card" content="summary_large_image" />

  </head>

  </body>
</html>
